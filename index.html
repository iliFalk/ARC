<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="https://vitejs.dev/logo.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AI Browser Workspace</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script>
      tailwind.config = {
        theme: {
          extend: {
            fontFamily: {
              sans: ['Inter', 'sans-serif'],
            },
            colors: {
              background: '#ffffff',
              foreground: '#09090b',
              primary: '#18181b',
              'primary-foreground': '#fafafa',
              muted: '#f4f4f5',
              'muted-foreground': '#52525b', /* Increased contrast from 71717a to 52525b */
              border: '#e4e4e7',
            }
          },
        },
      }
    </script>
    <style>
      body {
        font-family: 'Inter', sans-serif;
        background-color: #f3f4f6;
        height: 100vh;
        overflow: hidden;
      }
      /* Hide Scrollbar visually but allow scrolling */
      ::-webkit-scrollbar {
        width: 0px;
        background: transparent;
      }
      /* For Firefox */
      * {
        scrollbar-width: none;
      }
    </style>
